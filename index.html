<style>
:root{
  --ground:#EEF1EA; --surface:#F8FAF5; --ink:#1C2620; --muted:#5B6A5F; --line:#CCD5C8;
  --chip:#E1E8DC; --tape:#E0512A; --tape-ink:#FFFFFF; --good:#2F7D4F; --bad:#B23A2A;
  --display:"Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121813; --surface:#1A221C; --ink:#E3EAE1; --muted:#96A596; --line:#2D3A30;
    --chip:#223026; --tape:#F0663F; --good:#5DBB82; --bad:#E07262;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121813; --surface:#1A221C; --ink:#E3EAE1; --muted:#96A596; --line:#2D3A30;
  --chip:#223026; --tape:#F0663F; --good:#5DBB82; --bad:#E07262;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;box-sizing:border-box}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-inline:16px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand .tape{display:inline-block;width:18px;height:8px;background:var(--tape);transform:translateY(-3px) skewX(-18deg)}
.brand .binos{width:1.35em;height:auto;align-self:center;flex:none}
.brand .sub{font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:0;color:var(--muted)}
.meta{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:600}
.main{display:grid;grid-template-columns:1fr 390px;min-height:0}
.mapwrap{position:relative;min-height:0;overflow:hidden;background:#20331f}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.overlay{position:absolute;display:flex;gap:8px;align-items:center}
.ov-bl{left:12px;bottom:12px;font-size:12px;color:#EEF3E8;background:rgba(15,24,17,.72);padding:6px 10px;border-radius:4px;max-width:calc(100% - 300px)}
.ov-br{right:12px;bottom:12px}
.ov-tl{left:12px;top:12px;font-family:var(--mono);font-size:11px;color:#EEF3E8;background:rgba(15,24,17,.72);padding:5px 8px;border-radius:4px}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:4px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--tape);color:var(--tape-ink);letter-spacing:.01em}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.map{background:rgba(15,24,17,.82);color:#F3F6EF;border:1px solid rgba(255,255,255,.25)}
.btn:focus-visible,.tab:focus-visible,.opt:focus-visible,summary:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
aside{border-left:1px solid var(--line);background:var(--surface);display:grid;grid-template-rows:auto 1fr;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;padding:12px 8px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;font-size:14px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tape)}
.pane{overflow-y:auto;padding-block:16px;padding-inline:18px}
.eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;margin:4px 0 6px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.plate{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--ground)}
.badge{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:16px;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px var(--line)}
.portrait{border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.portrait svg{display:block;width:100%;height:100%}
.portrait.s{width:28px;height:28px}
.portrait.m{width:64px;height:64px}
.portrait.xl{width:100%;max-width:220px;aspect-ratio:1;height:auto;margin-inline:auto;border-radius:10px;box-shadow:0 0 0 1px var(--line);animation:reveal .5s ease both}
@keyframes reveal{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}
.sci{font-style:italic;color:var(--muted);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-size:12px}
.cues{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--tape);padding-left:12px}
.cue{animation:in .45s ease both}
@keyframes in{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bar{height:4px;background:var(--chip);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tape);width:0}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}
.opt:hover{border-color:var(--tape)}
.opt code,.code{font-family:var(--mono);font-weight:600;font-size:13px}
.opt.right{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.verdict{font-weight:700}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.note{background:var(--chip);padding:10px 12px;border-radius:5px;font-size:14px}
.entries{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:46px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.entry .t{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.entry .what{font-size:14px}
.entry .sub{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.fix{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.prog{display:grid;gap:8px}
.progrow{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:3px;background:var(--chip);color:var(--muted)}
.chip.on{background:var(--ink);color:var(--surface)}
details{border-bottom:1px solid var(--line);padding-block:10px}
summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
.beh{display:grid;grid-template-columns:48px 1fr;gap:10px;padding-top:10px;font-size:14px}
.beh b{display:block}
.empty{padding:18px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);text-align:center}
.small{font-size:13px}
.copy{font-size:11px;color:var(--muted);margin:6px 0 0;text-align:center}
.warn{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:6px;background:color-mix(in srgb,var(--bad) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);color:var(--ink);font-size:14px}
.warn b{color:var(--bad)}
.danger-flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 6px #E24030,inset 0 0 90px rgba(226,64,48,.55);animation:dflash .9s ease-out forwards;z-index:2}
@keyframes dflash{from{opacity:1}to{opacity:0}}
.guide-h{margin:18px 0 4px}
.scene{width:100%;aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.scene svg{display:block;width:100%;height:100%}
.timer{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.toast{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:rgba(15,24,17,.92);color:#F3F6EF;padding:9px 14px;border-radius:6px;font-size:13px;max-width:min(420px,86%);text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:3}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.stat{background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--muted)}
.stat b{display:block;font-family:var(--display);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bdg{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:12px;line-height:1.3;background:var(--surface)}
.bdg.locked{opacity:.5;filter:grayscale(1)}
.bdg .ico{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-family:var(--mono);font-weight:700;font-size:11px;color:var(--ink)}
.bdg b{display:block;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;vertical-align:middle}
.seg button{border:0;background:transparent;padding:3px 9px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--tape);outline-offset:-2px}
.helpbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;padding:3px 10px;font-size:12px;font-weight:600}
.helpbtn:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.tut-block{position:fixed;inset:0;z-index:50}
.tut-hole{position:fixed;z-index:51;border-radius:12px;box-shadow:0 0 0 9999px rgba(10,16,12,.64);outline:2px solid var(--tape);outline-offset:2px;pointer-events:none;transition:top .25s,left .25s,width .25s,height .25s,border-radius .25s}
.tut-card{position:fixed;z-index:52;width:min(340px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border-radius:10px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.35);transition:top .25s,left .25s}
.tut-card h3{font-size:20px;margin:2px 0 6px;text-wrap:balance}
.tut-card p{font-size:14px;margin:0 0 12px}
.tut-foot{display:flex;align-items:center;gap:8px}
.tut-foot .sp{flex:1}
.tut-dots{display:flex;gap:4px}
.tut-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tut-dots i.on{background:var(--tape)}
.tut-skip{background:none;border:0;color:var(--muted);font-size:13px;padding:6px 4px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.tut-hole,.tut-card{transition:none}}
@media (max-width:820px){
  .main{grid-template-columns:1fr;grid-template-rows:52% 48%}
  aside{border-left:0;border-top:1px solid var(--line)}
  .brand{font-size:19px}
  .meta{gap:10px}
  .ov-bl{max-width:calc(100% - 180px);font-size:11px}
}
.camp{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(6,10,7,.94);color:#EEF3E8;animation:godark 1.2s ease both;overflow-y:auto}
.camp[hidden]{display:none!important}
@keyframes godark{from{background:rgba(6,10,7,0)}to{background:rgba(6,10,7,.94)}}
.camp-card{max-width:420px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:in .6s .5s ease both}
.camp-card h2{color:#fff;font-size:30px;margin:0}
.camp-card p{color:#C9D3C6;margin:0;font-size:15px}
.camp-card .eyebrow{color:#E07262}
.camp-time{font-family:var(--mono);font-size:48px;font-weight:600;font-variant-numeric:tabular-nums;color:#fff;line-height:1;margin-top:6px}
.camp-sub{font-size:13px;color:#96A596}
@media (prefers-reduced-motion:reduce){.cue,.portrait.xl,.danger-flash,.camp,.camp-card{animation:none}}
</style>
</head>

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><radialGradient id="${id}" cx="38%" cy="30%" r="78%"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></radialGradient><radialGradient id="${id}b" cx="50%" cy="35%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="200" height="200" fill="${ART_BG[sp]||SPECIES[sp].bg}"/><rect width="200" height="200" fill="url(#${id}b)"/>${PORTRAIT_ART[sp].replace(/url\(#SHD\)/g,`url(#${id})`).replace(/HCLIP/g,"hc-"+sp)}</svg>`; }
const PORTRAIT_IMG = {};
[...SP_KEYS,"EL","VP","JA"].forEach(sp=>{ const im=new Image(); im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(portraitSVG(sp)); PORTRAIT_IMG[sp]=im; });
const portraitHTML=(sp,cls)=>`<div class="portrait ${cls||""}" role="img" aria-label="${(SPECIES[sp]||HAZ_NAME[sp]||{name:sp}).name} illustration">${portraitSVG(sp)}</div>`;

/* ---------- World ---------- */
const W=2400, H=1600;
const PAD=80, APAD=100; // how far inside the reserve boundary you (PAD) and the animals (APAD) stay
let seed = 20260923;
function rnd(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
const R=(a,b)=>a+rnd()*(b-a);
const riverY = x => 820 + 90*Math.sin(x/260) + 40*Math.sin(x/90+1.3);
const RIVER_HALF = 24;
function zoneAt(x,y){
  if (Math.abs(y-riverY(x))<RIVER_HALF) return "river";
  if (x<520) return "plot";
  return y<riverY(x) ? "north" : "south";
}
const ZONE_NAME = {north:"Forest",south:"Forest",plot:"Forest",river:"River crossing (wading)"};

const off = document.createElement("canvas"); off.width=W; off.height=H;
(function paintWorld(){
  const c = off.getContext("2d");
  c.fillStyle="#2C4731"; c.fillRect(0,0,W,H);
  c.fillStyle="#35522F"; c.fillRect(0,0,520,H);
  // texture
  for(let i=0;i<5000;i++){ const x=R(0,W),y=R(0,H); const z=zoneAt(x,y);
    c.fillStyle = (rnd()<.5?"rgba(120,160,90,.10)":"rgba(0,0,0,.10)");
    c.beginPath(); c.ellipse(x,y,R(3,14),R(3,10),R(0,3),0,7); c.fill(); }
  // clearings
  for(let i=0;i<22;i++){ const x=R(40,W-40), y=R(40,H-40); if(Math.abs(y-riverY(x))<90) continue;
    c.fillStyle="rgba(120,150,80,.55)"; c.beginPath(); c.ellipse(x,y,R(30,70),R(22,50),R(0,3),0,7); c.fill(); }
  // canopy
  for(let i=0;i<1700;i++){ const x=R(0,W), y=R(0,H); if(Math.abs(y-riverY(x))<RIVER_HALF+12) continue;
    const r=R(10,26), plot=x<520;
    c.fillStyle = plot ? "#284A2A" : "#20392A"; c.beginPath(); c.arc(x+2,y+3,r,0,7); c.fill();
    c.fillStyle = plot ? "#3E6A36" : "#335A3A"; c.beginPath(); c.arc(x,y,r*.92,0,7); c.fill();
    c.fillStyle = "rgba(170,210,130,.12)"; c.beginPath(); c.arc(x-r*.3,y-r*.3,r*.45,0,7); c.fill(); }
  // river
  const path=()=>{ c.beginPath(); for(let x=-20;x<=W+20;x+=8){ const y=riverY(x); x===-20?c.moveTo(x,y):c.lineTo(x,y);} };
  c.lineCap="round"; c.lineJoin="round";
  path(); c.strokeStyle="#8A8156"; c.lineWidth=RIVER_HALF*2+14; c.stroke();
  path(); c.strokeStyle="#3C7888"; c.lineWidth=RIVER_HALF*2; c.stroke();
  path(); c.strokeStyle="rgba(150,200,210,.35)"; c.lineWidth=10; c.stroke();
  // trails
  c.setLineDash([10,8]); c.strokeStyle="rgba(236,224,190,.6)"; c.lineWidth=3;
  const trail=(pts)=>{ c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.stroke(); };
  trail([[0,420],[300,390],[600,440],[900,400],[1200,430],[1500,380],[1800,420],[2100,360],[2400,400]]);
  trail([[0,1230],[350,1190],[700,1260],[1050,1210],[1400,1270],[1750,1220],[2100,1260],[2400,1230]]);
  trail([[1200,0],[1180,300],[1220,600],[1190,820],[1230,1100],[1200,1600]]);
  trail([[700,440],[640,700],[720,1000],[700,1260]]);
  c.setLineDash([]);
  // deeper forest shadow along the reserve boundary
  const EDGE=110, shade=(x0,y0,x1,y1,rx,ry,rw,rh)=>{ const g=c.createLinearGradient(x0,y0,x1,y1); g.addColorStop(0,"rgba(8,18,10,.62)"); g.addColorStop(.5,"rgba(8,18,10,.22)"); g.addColorStop(1,"rgba(8,18,10,0)"); c.fillStyle=g; c.fillRect(rx,ry,rw,rh); };
  shade(0,0,EDGE,0, 0,0,EDGE,H); shade(W,0,W-EDGE,0, W-EDGE,0,EDGE,H); shade(0,0,0,EDGE, 0,0,W,EDGE); shade(0,H,0,H-EDGE, 0,H-EDGE,W,EDGE);
})();

/* ---------- Behaviour scenes ---------- */
const BODY={PT:"#1B1715",PP:"#1A1716",CJ:"#8E877E",CA:"#6A6668"};
function bust(sp,x,y,s,flip,rot){ return `<g transform="translate(${x} ${y}) rotate(${rot||0}) scale(${flip?-s:s} ${s}) translate(-100 -100)">${PORTRAIT_ART[sp].replace(/url\(#SHD\)/g,"url(#scnShd)")}</g>`; }
function head(sp,x,y,s){ return `<g transform="translate(${x} ${y}) scale(${s}) translate(-100 -100)"><g clip-path="url(#scnHead)">${PORTRAIT_ART[sp].replace(/url\(#SHD\)/g,"url(#scnShd)")}</g></g>`; }
const P={
  trunk:(x,w)=>`<path d="M${x} 0 L${x+w} 0 L${x+w+6} 160 L${x-6} 160 Z" fill="#6B5440"/><path d="M${x+w*.3} 0 L${x+w*.45} 0 L${x+w*.5} 160 L${x+w*.25} 160 Z" fill="#7C6450"/>`,
  mound:(x)=>`<path d="M${x-44} 158 C${x-34} 120 ${x-16} 64 ${x} 60 C${x+16} 64 ${x+34} 120 ${x+44} 158 Z" fill="#A07650"/><ellipse cx="${x-8}" cy="104" rx="4" ry="3" fill="#5E4230"/><ellipse cx="${x+12}" cy="128" rx="4" ry="3" fill="#5E4230"/>`,
  stick:(x1,y1,x2,y2)=>`<path d="M${x1} ${y1} L${x2} ${y2}" stroke="#7A5A3A" stroke-width="3" stroke-linecap="round"/>`,
  arm:(x1,y1,x2,y2,c)=>`<path d="M${x1} ${y1} Q${(x1+x2)/2} ${Math.min(y1,y2)-16} ${x2} ${y2}" stroke="${c}" stroke-width="12" stroke-linecap="round" fill="none"/>`,
  fruit:(x,y)=>`<circle cx="${x}" cy="${y}" r="10" fill="#E08A2E"/><ellipse cx="${x+4}" cy="${y-11}" rx="6" ry="3" fill="#4E7A46" transform="rotate(-25 ${x+4} ${y-11})"/>`,
  nut:(x,y)=>`<circle cx="${x}" cy="${y}" r="8" fill="#7A5230"/><path d="M${x+14} ${y+10} a7 7 0 0 1 14 0 Z" fill="#8E6440"/><path d="M${x-26} ${y+12} a6 6 0 0 1 12 0 Z" fill="#8E6440"/>`,
  sound:(x,y)=>[0,1,2].map(i=>`<path d="M${x+i*10} ${y-12-i*4} Q${x+10+i*12} ${y} ${x+i*10} ${y+12+i*4}" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="${.9-i*.25}" stroke-linecap="round"/>`).join(""),
  branch:(x1,y1,x2,y2)=>`<path d="M${x1} ${y1} L${x2} ${y2}" stroke="#6B5440" stroke-width="6" stroke-linecap="round"/><ellipse cx="${x1+6}" cy="${y1-6}" rx="9" ry="4" fill="#5E8A4E" transform="rotate(-30 ${x1+6} ${y1-6})"/>`,
  puffs:(x,y)=>[0,1,2].map(i=>`<circle cx="${x-i*16}" cy="${y-i*3}" r="${8-i*2}" fill="#D8CBB0" opacity="${.8-i*.2}"/>`).join(""),
  stems:(x)=>[0,1,2].map(i=>`<path d="M${x+i*8} 150 L${x+14+i*6} ${70+i*6}" stroke="#5E8A4E" stroke-width="3" stroke-linecap="round"/><ellipse cx="${x+14+i*6}" cy="${68+i*6}" rx="7" ry="3" fill="#6FA05A" transform="rotate(-50 ${x+14+i*6} ${68+i*6})"/>`).join(""),
  nest:(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="46" ry="13" fill="#7A6A3A"/><ellipse cx="${x}" cy="${y-3}" rx="36" ry="7" fill="#5E4E2A"/><ellipse cx="${x-30}" cy="${y+2}" rx="10" ry="4" fill="#6FA05A"/><ellipse cx="${x+32}" cy="${y}" rx="9" ry="4" fill="#6FA05A"/>`,
  holes:(x)=>[[x+10,52],[x+22,78],[x+8,98],[x+24,120]].map(([a,b])=>`<ellipse cx="${a}" cy="${b}" rx="4" ry="6" fill="#3E2E20"/><ellipse cx="${a}" cy="${b+6}" rx="2.5" ry="3" fill="#E8C24A" opacity=".85"/>`).join(""),
  scent:(x,y)=>[0,1,2,3,4].map(i=>`<circle cx="${x+i*14}" cy="${y-i*2}" r="${3+i*.4}" fill="#C9B27A" opacity="${.35+i*.1}"/>`).join(""),
  litter:()=>[[40,164,"#9A6A3A"],[70,170,"#C08A40"],[250,166,"#9A6A3A"],[285,172,"#C08A40"],[110,174,"#7A5230"],[215,176,"#C08A40"]].map(([a,b,c])=>`<ellipse cx="${a}" cy="${b}" rx="9" ry="3.5" fill="${c}" transform="rotate(${(a%30)-15} ${a} ${b})"/>`).join(""),
};
function sceneSVG(sp,code){
  const C=BODY[sp], z=SPECIES[sp].zones[0];
  const sky= sp==="CJ"?["#E9EFD2","#C9DDB0"]:["#D6E6CF","#A9C8A2"];
  let back="", mid="", front="";
  const one=(x)=>bust(sp,x,108,.55);
  const pair=()=>bust(sp,112,112,.5)+bust(sp,214,108,.55,true);
  switch(code){
    case "GRM": mid=pair()+P.arm(214-26,132,134,110,C); break;
    case "RST": back=P.trunk(60,40); mid=one(185); break;
    case "TLU": back=P.mound(90); mid=one(210)+P.stick(104,98,170,134); break;
    case "DSP": mid=one(200)+P.branch(118,150,158,126)+P.puffs(110,156); break;
    case "PHT": back=P.trunk(44,32); mid=one(170)+P.sound(214,74); break;
    case "FSH": mid=pair()+P.fruit(160,138); break;
    case "PLY": mid=bust(sp,120,122,.44,false,-14)+bust(sp,206,120,.44,true,12); break;
    case "BIP": mid=P.stems(96)+one(190); break;
    case "NST": back=P.trunk(146,28); mid=bust(sp,160,74,.36); front=P.nest(160,102); break;
    case "GUG": back=P.trunk(170,44)+P.holes(170); mid=bust(sp,128,110,.5); break;
    case "SCM": back=`<path d="M0 96 L320 84" stroke="#6B5440" stroke-width="10" stroke-linecap="round"/>`; mid=one(200)+P.scent(60,120); break;
    case "INC": mid=one(170)+head(sp,140,128,.2)+head(sp,204,126,.22); break;
    case "PHE": back=P.trunk(40,30); mid=one(170)+P.sound(212,76); break;
    case "FGR": mid=one(170); front=P.litter(); break;
    case "NUT": mid=one(195)+P.nut(126,142); break;
    case "LPS": mid=pair(); break;
    case "EYL": mid=pair(); break;
    default: mid=one(160);
  }
  const trees=[20,95,250,300].map((x,i)=>`<rect x="${x}" y="0" width="${10+i%2*6}" height="160" fill="#8FAE86" opacity=".6"/>`).join("")
    +[[40,18,50],[130,8,60],[230,14,56],[300,20,44]].map(([x,y,r])=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.55}" fill="#7FA676" opacity=".7"/>`).join("");
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="${esc(SPECIES[sp].name)} scene">
    <defs><linearGradient id="scnSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient>
    <radialGradient id="scnShd" cx="38%" cy="30%" r="78%"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></radialGradient>
    <clipPath id="scnHead"><circle cx="100" cy="98" r="60"/></clipPath></defs>
    <rect width="320" height="180" fill="url(#scnSky)"/>${trees}${back}${mid}
    <path d="M0 152 C60 146 120 156 180 150 C240 145 290 154 320 150 L320 180 L0 180 Z" fill="#6E5A3E"/>
    <path d="M0 160 C70 156 140 164 210 158 C260 154 300 160 320 158 L320 180 L0 180 Z" fill="#5E4C34"/>${front}</svg>`;
}

/* ---------- State ---------- */
const player = {x:1210, y:560, dest:null, heading:0};
const cam = {x:player.x, y:player.y};
let groups = [];
let log = [];
let learned = {}; SP_KEYS.forEach(k=>learned[k]=new Set());
let scanUntil=0, scanReadyAt=0;
const FLEE=27; // your dot touching the animal marker
let toastT=0;
function toast(msg,ms){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true;},ms||4200); }
let obs=null; // {g, stage, shown, options, choice}
let keys={};
try { const s=JSON.parse(localStorage.getItem("transect-log")||"null"); if(s&&Array.isArray(s.log)){ log=s.log.filter(e=>SPECIES[e.sp]); log.forEach(e=>{ if(e.ok && learned[e.sp] && SPECIES[e.sp].behs.some(x=>x.code===e.code)) learned[e.sp].add(e.code); }); } } catch(e){}
function save(){ try{ localStorage.setItem("transect-log", JSON.stringify({log})); }catch(e){} }

let idN=1;
function makeGroup(sp, near){
  const S=SPECIES[sp]; let x,y,tries=0;
  do { x=R(APAD,W-APAD); y=R(APAD,H-APAD); tries++; }
  while(tries<500 && (!S.zones.includes(zoneAt(x,y)) || (!near && Math.hypot(x-player.x,y-player.y)<380)));
  if(near){ x=near.x; y=near.y; }
  const bi = Math.floor(rnd()*S.behs.length), b=S.behs[bi];
  const sex = b.sex || ["M","F","F","J"][Math.floor(rnd()*4)];
  const a=R(0,6.28);
  return {id:idN++, sp, x, y, vx:Math.cos(a)*R(4,9), vy:Math.sin(a)*R(4,9), bi,
          indiv:`${sp}-${sex}${String(Math.floor(R(1,40))).padStart(2,"0")}`};
}
SP_KEYS.forEach(sp=>{ for(let i=0;i<4;i++) groups.push(makeGroup(sp)); });
// one chimp party close to the start so the first view has something to follow
groups.push(makeGroup("PT",{x:1330,y:500}));

/* ---------- Hazards: animals to avoid ---------- */
const HAZ={
  EL:{name:"Forest elephant", sci:"Loxodonta cyclotis", zones:["north"], see:150, danger:55, speed:4, n:3,
      warn:"Forest elephant ahead. Give it plenty of space.",
      hit:"The forest elephant mock-charged, trumpeting and flapping its ears! Elephants need at least 50 m of space. Back off early and never come between a mother and calf."},
  VP:{name:"Rhinoceros viper", sci:"Bitis nasicornis", zones:["north"], see:60, danger:28, speed:0, n:4,
      warn:"Rhinoceros viper on the ground! Step around it.",
      hit:"You nearly stepped on a rhinoceros viper! Its bright pattern breaks up its outline among the leaves. Watch where you put your feet and stay on trails."},
  JA:{name:"Jararaca", sci:"Bothrops jararaca", zones:["plot"], see:60, danger:28, speed:0, n:3,
      warn:"Jararaca on the ground! Step around it.",
      hit:"A jararaca struck at your boot! This pit viper is well camouflaged on the forest floor. Watch where you step and wear boots in the field."},
};
let hazards=[], incidents=[];
try{ const d=JSON.parse(localStorage.getItem("transect-safety")||"null"); if(d){ incidents=Array.isArray(d.incidents)?d.incidents:[]; } }catch(e){}
function saveSafety(){ try{ localStorage.setItem("transect-safety",JSON.stringify({incidents})); }catch(e){} }
function makeHazard(kind){
  const Z=HAZ[kind]; let x,y,t=0;
  do{ x=R(APAD,W-APAD); y=R(APAD,H-APAD); t++; } while(t<500 && (!Z.zones.includes(zoneAt(x,y)) || Math.hypot(x-player.x,y-player.y)<320 || groups.some(g=>Math.hypot(g.x-x,g.y-y)<60)));
  const a=R(0,6.28), o={id:idN++, haz:kind, x, y, vx:Math.cos(a)*Z.speed, vy:Math.sin(a)*Z.speed, cool:0};
  return o;
}
function spawnHazards(){ hazards=[]; Object.keys(HAZ).forEach(k=>{ for(let i=0;i<HAZ[k].n;i++) hazards.push(makeHazard(k)); }); }
spawnHazards();
function hazLevel(h){ const d=Math.hypot(h.x-player.x,h.y-player.y);
  if(d<HAZ[h.haz].see) return 2;
  if(h.haz==="EL" && performance.now()<scanUntil && d<SCAN) return 2;
  return 0; }
function incident(h,now){
  const Z=HAZ[h.haz]; h.cool=now+6000;
  incidents.push({k:h.haz,t:Date.now()}); saveSafety();
  obs=null; keys={}; player.dest=null;
  playFx(h.haz==="EL"?"el":"hiss");
  flash(); sendToCamp(h.haz);
}
/* ---------- Back to camp: 2-minute time-out after a safety incident ---------- */
const CAMP={x:1210,y:560}, CAMP_MS=2*60*1000;
let camp=null; // {until, k}
try{ const c=JSON.parse(localStorage.getItem("transect-camp")||"null"); if(c && c.until>Date.now() && HAZ[c.k]){ c.until=Math.min(c.until,Date.now()+CAMP_MS); camp=c; } }catch(e){}
const inCamp=()=>!!camp;
function sendToCamp(k){
  camp={until:Date.now()+CAMP_MS, k}; try{ localStorage.setItem("transect-camp",JSON.stringify(camp)); }catch(e){}
  player.x=CAMP.x; player.y=CAMP.y; cam.x=CAMP.x; cam.y=CAMP.y; lastField=""; renderPane(); showCamp(); }
function showCamp(){
  const box=document.getElementById("camp"), Z=HAZ[camp.k];
  box.innerHTML=`<div class="camp-card">${portraitHTML(camp.k,"m")}<div class="eyebrow">Safety incident · −15 points</div>
    <h2 id="campT">Back to camp</h2><p>${esc(Z.hit)}</p>
    <p>Your field team has brought you back to camp. You can go out again once it's safe.</p>
    <div class="camp-time" id="campTime">${fmtT(Math.max(0,camp.until-Date.now()))}</div><div class="camp-sub" id="campSub">until it's safe to head back out</div>
    <button class="btn" id="campGo" hidden>Head back out</button></div>`;
  box.hidden=false; document.querySelector(".app").inert=true;
  document.getElementById("campGo").addEventListener("click",leaveCamp);
  box.tabIndex=-1; box.focus(); tickCamp(); }
function tickCamp(){ if(!camp) return; const left=camp.until-Date.now(), t=document.getElementById("campTime"); if(!t) return;
  if(left>0){ t.textContent=fmtT(left+999); return; }
  t.textContent="0:00"; const sub=document.getElementById("campSub"), go=document.getElementById("campGo");
  if(go.hidden){ sub.textContent="It's safe now."; go.hidden=false; go.focus(); } }
function leaveCamp(){ camp=null; try{ localStorage.removeItem("transect-camp"); }catch(e){}
  const box=document.getElementById("camp"); box.hidden=true; box.innerHTML=""; document.querySelector(".app").inert=false;
  player.x=CAMP.x; player.y=CAMP.y; lastField=""; renderPane(); toast("Back in the field. Keep outside the red circles this time.",4000);
  if(!tutShown) setTimeout(tutOpen,600); }
function flash(){ const f=document.getElementById("dangerFlash"); if(!f) return; f.hidden=false; f.style.animation="none"; void f.offsetWidth; f.style.animation=""; setTimeout(()=>{f.hidden=true;},900); }

/* ---------- Canvas ---------- */
const cv=document.getElementById("map"), ctx=cv.getContext("2d"), wrap=document.getElementById("mapwrap");
let cw=0,ch=0,dpr=1;
function resize(){ const r=wrap.getBoundingClientRect(); dpr=Math.min(2,window.devicePixelRatio||1);
  cw=r.width; ch=r.height; cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr); }
new ResizeObserver(resize).observe(wrap); resize();

const DETECT=110, IDENT=60, RANGE=40, SCAN=260;
function levelOf(g){ const d=Math.hypot(g.x-player.x,g.y-player.y);
  if(g.wary && performance.now()<g.wary) return d<IDENT?2:(d<DETECT?1:0);
  if(d<RANGE) return 3; if(d<IDENT) return 2;
  if(performance.now()<scanUntil && d<SCAN) return 2;
  if(d<DETECT) return 1; return 0; }

// keep the view inside the reserve so the empty area beyond the map never shows
function clampCam(){ cam.x = cw>=W ? W/2 : Math.max(cw/2,Math.min(W-cw/2,cam.x)); cam.y = ch>=H ? H/2 : Math.max(ch/2,Math.min(H-ch/2,cam.y)); }
function toScreen(x,y){ return [x-cam.x+cw/2, y-cam.y+ch/2]; }
cv.addEventListener("pointerdown", e=>{
  if(obs||inCamp()) return;
  const r=cv.getBoundingClientRect(); const px=e.clientX-r.left, py=e.clientY-r.top;
  let wx=px-cw/2+cam.x, wy=py-ch/2+cam.y;
  for(const h of hazards){ const L=hazLevel(h); if(!L) continue; const [sx,sy]=toScreen(h.x,h.y); if(Math.hypot(sx-px,sy-py)<32){
      toast(`That's a ${HAZ[h.haz].name.toLowerCase()}. Don't walk towards it: keep your distance.`); return; } }
  for(const g of groups){ const L=levelOf(g); if(L>=1){ const [sx,sy]=toScreen(g.x,g.y); if(Math.hypot(sx-px,sy-py)<32){
      if(L===3){ startObs(g); return; }
      const dx=g.x-player.x, dy=g.y-player.y, d=Math.hypot(dx,dy), stop=RANGE-8;
      wx=d>stop? g.x-dx/d*stop : player.x; wy=d>stop? g.y-dy/d*stop : player.y; break; } } }
  player.dest={x:Math.max(PAD,Math.min(W-PAD,wx)), y:Math.max(PAD,Math.min(H-PAD,wy))};
});
addEventListener("keydown",e=>{ if(tutEls||inCamp()) return; const k=e.key.toLowerCase(); if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(k)){ if(e.target.tagName!=="INPUT"){ keys[k]=true; e.preventDefault(); } } });
addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; });

document.getElementById("scanBtn").addEventListener("click",()=>{
  const now=performance.now(); if(now<scanReadyAt) return;
  scanUntil=now+6000; scanReadyAt=now+6000; updateScanBtn();
});
function updateScanBtn(){ const b=document.getElementById("scanBtn"); const now=performance.now();
  if(now<scanReadyAt){ b.disabled=true; b.textContent=`Binoculars ready in ${Math.ceil((scanReadyAt-now)/1000)} s`; }
  else { b.disabled=false; b.textContent="Scan with binoculars"; } }

let last=performance.now();
function step(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  // player movement
  let walkedOnLand=false;
  if(!obs && !inCamp()){
    let mx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0), my=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
    if(mx||my){ player.dest=null; }
    else if(player.dest){ const dx=player.dest.x-player.x, dy=player.dest.y-player.y, d=Math.hypot(dx,dy);
      if(d<3) player.dest=null; else { mx=dx/d; my=dy/d; } }
    if(mx||my){ const n=Math.hypot(mx,my); const inRiver=zoneAt(player.x,player.y)==="river", sp=(inRiver?38:95)*dt, ox=player.x, oy=player.y;
      player.x=Math.max(PAD,Math.min(W-PAD,player.x+mx/n*sp)); player.y=Math.max(PAD,Math.min(H-PAD,player.y+my/n*sp));
      player.heading=Math.atan2(my,mx); walkedOnLand=!inRiver && (player.x!==ox||player.y!==oy); }
  }
  updateSteps(walkedOnLand);
  // animals wander within their zones
  for(const g of groups){
    if(obs && obs.g===g) continue;
    const dist=Math.hypot(g.x-player.x,g.y-player.y);
    if(dist<FLEE && !(g.wary && now<g.wary)){
      g.wary=now+25000; const a=Math.atan2(g.y-player.y,g.x-player.x); g.vx=Math.cos(a)*45; g.vy=Math.sin(a)*45;
      player.dest=null;
      toast(`Too close! The ${SPECIES[g.sp].name.toLowerCase()}s moved off. Stop about 40 m away so you don't disturb them.`);
    }
    if(g.wary && now>=g.wary){ g.wary=0; const a=R(0,6.28); g.vx=Math.cos(a)*6; g.vy=Math.sin(a)*6; }
    if(!(g.wary && now<g.wary) && dist<RANGE+15) continue; // animals settle while you watch them
    if(!(g.wary && now<g.wary) && rnd()<.01){ const a=R(0,6.28), s=R(3,10); g.vx=Math.cos(a)*s; g.vy=Math.sin(a)*s; }
    const nx=g.x+g.vx*dt, ny=g.y+g.vy*dt;
    if(SPECIES[g.sp].zones.includes(zoneAt(nx,ny)) && nx>APAD&&nx<W-APAD&&ny>APAD&&ny<H-APAD){ g.x=nx; g.y=ny; } else { g.vx*=-1; g.vy*=-1; }
  }
  for(const h of hazards){ const Z=HAZ[h.haz], dist=Math.hypot(h.x-player.x,h.y-player.y);
    if(!tutEls && !inCamp()){ const vis=hazLevel(h)>0; if(vis && !h.vis && now>(h.quiet||0)){ playFx(h.haz==="EL"?"el":"hiss",FX_FAR); h.quiet=now+20000; } h.vis=vis; }
    if(!obs && !tutEls && !inCamp() && now>h.cool && dist<Z.danger){ incident(h,now); continue; }
    if(!Z.speed) continue;
    if(rnd()<.008){ const a=R(0,6.28), sp=R(.5,1)*Z.speed; h.vx=Math.cos(a)*sp; h.vy=Math.sin(a)*sp; }
    const nx=h.x+h.vx*dt, ny=h.y+h.vy*dt;
    if(Z.zones.includes(zoneAt(nx,ny)) && nx>APAD&&nx<W-APAD&&ny>APAD&&ny<H-APAD){ h.x=nx; h.y=ny; } else { h.vx*=-1; h.vy*=-1; } }
  cam.x+= (player.x-cam.x)*Math.min(1,dt*6); cam.y+=(player.y-cam.y)*Math.min(1,dt*6); clampCam();
  draw(now);
  requestAnimationFrame(step);
}

function draw(now){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle="#1d2e1d"; ctx.fillRect(0,0,cw,ch);
  const sx=cam.x-cw/2, sy=cam.y-ch/2;
  ctx.drawImage(off, sx, sy, cw, ch, 0, 0, cw, ch);
  // survey grid, 200 m
  ctx.strokeStyle="rgba(255,255,255,.08)"; ctx.lineWidth=1; ctx.font="10px 'JetBrains Mono', monospace"; ctx.fillStyle="rgba(255,255,255,.35)";
  for(let gx=Math.ceil(sx/200)*200; gx<sx+cw; gx+=200){ const x=gx-sx; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,ch); ctx.stroke(); ctx.fillText("E"+String(gx).padStart(4,"0"), x+3, 12); }
  for(let gy=Math.ceil(sy/200)*200; gy<sy+ch; gy+=200){ const y=gy-sy; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cw,y); ctx.stroke(); ctx.fillText("N"+String(H-gy).padStart(4,"0"), 3, y-3); }
  // detection radius
  const [px,py]=toScreen(player.x,player.y);
  ctx.setLineDash([4,6]); ctx.strokeStyle="rgba(255,255,255,.28)"; ctx.beginPath(); ctx.arc(px,py,DETECT,0,7); ctx.stroke(); ctx.setLineDash([]);
  if(now<scanUntil){ const k=(scanUntil-now)/6000; ctx.strokeStyle=`rgba(240,102,63,${.5*k})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(px,py,SCAN,0,7); ctx.stroke(); ctx.lineWidth=1; }
  // destination flag
  if(player.dest){ const [dx,dy]=toScreen(player.dest.x,player.dest.y);
    ctx.strokeStyle="#F0663F"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(dx-5,dy-5); ctx.lineTo(dx+5,dy+5); ctx.moveTo(dx+5,dy-5); ctx.lineTo(dx-5,dy+5); ctx.stroke(); ctx.lineWidth=1; }
  // camp
  { const [tx,ty]=toScreen(CAMP.x,CAMP.y); if(tx>-40&&tx<cw+40&&ty>-40&&ty<ch+40){
    ctx.fillStyle="rgba(214,196,150,.35)"; ctx.beginPath(); ctx.ellipse(tx,ty+6,30,18,0,0,7); ctx.fill();
    ctx.fillStyle="#E8D9B0"; ctx.beginPath(); ctx.moveTo(tx-14,ty+10); ctx.lineTo(tx,ty-12); ctx.lineTo(tx+14,ty+10); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#6B5440"; ctx.beginPath(); ctx.moveTo(tx-3,ty+10); ctx.lineTo(tx,ty+1); ctx.lineTo(tx+3,ty+10); ctx.closePath(); ctx.fill();
    ctx.fillStyle="rgba(243,246,239,.85)"; ctx.font="600 10px 'JetBrains Mono', monospace"; ctx.textAlign="center"; ctx.textBaseline="alphabetic"; ctx.fillText("CAMP",tx,ty+24); } }
  // animals
  for(const g of groups){ const L=levelOf(g); if(!L) continue; const [x,y]=toScreen(g.x,g.y); const S=SPECIES[g.sp];
    if(L===1){ const p=4*Math.sin(now/260+g.id);
      ctx.strokeStyle="rgba(255,255,255,.75)"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,y,14+p,0,7); ctx.stroke();
      ctx.strokeStyle="rgba(255,255,255,.3)"; ctx.beginPath(); ctx.arc(x,y,22+p,0,7); ctx.stroke();
      ctx.fillStyle="#fff"; ctx.font="600 13px 'Source Sans 3', sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("?",x,y+1);
    } else {
      const r=L===3?21:18;
      if(L===3){ const p=3*Math.sin(now/200); ctx.strokeStyle="#F0663F"; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(x,y,r+7+p,0,7); ctx.stroke(); }
      ctx.fillStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(x+1.5,y+2.5,r,0,7); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.clip();
      ctx.fillStyle=S.bg; ctx.fillRect(x-r,y-r,r*2,r*2);
      const im=PORTRAIT_IMG[g.sp]; if(im.complete && im.naturalWidth) ctx.drawImage(im,x-r*1.25,y-r*1.2,r*2.5,r*2.5);
      ctx.restore();
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.strokeStyle="rgba(255,255,255,.95)"; ctx.lineWidth=2.5; ctx.stroke();
    }
    ctx.lineWidth=1;
  }
  // hazards
  for(const h of hazards){ const L=hazLevel(h); if(!L) continue; const [x,y]=toScreen(h.x,h.y);
    const key=h.haz, r=h.haz==="EL"?22:17;
    { const [ppx,ppy]=toScreen(player.x,player.y); const near=Math.hypot(h.x-player.x,h.y-player.y)<HAZ[h.haz].danger+40;
      ctx.setLineDash([5,5]); ctx.strokeStyle=near?"rgba(226,64,48,.95)":"rgba(226,64,48,.55)"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,HAZ[h.haz].danger,0,7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle="rgba(226,64,48,.10)"; ctx.beginPath(); ctx.arc(x,y,HAZ[h.haz].danger,0,7); ctx.fill(); }
    ctx.fillStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(x+1.5,y+2.5,r,0,7); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.clip();
    ctx.fillStyle=ART_BG[key]||SPECIES.PT.bg; ctx.fillRect(x-r,y-r,r*2,r*2);
    const im=PORTRAIT_IMG[key]; if(im&&im.complete&&im.naturalWidth) ctx.drawImage(im,x-r*1.25,y-r*1.2,r*2.5,r*2.5);
    ctx.restore();
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.strokeStyle="#E24030"; ctx.lineWidth=2.5; ctx.stroke();
    { ctx.fillStyle="#E24030"; ctx.beginPath(); ctx.arc(x+r*.72,y-r*.72,7,0,7); ctx.fill(); ctx.fillStyle="#fff"; ctx.font="700 10px 'Source Sans 3', sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("!",x+r*.72,y-r*.72+.5); }
    ctx.lineWidth=1; }
  // player
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(px+1,py+2,10,0,7); ctx.fill();
  ctx.save(); ctx.translate(px,py); ctx.rotate(player.heading);
  ctx.fillStyle="#F0663F"; ctx.beginPath(); ctx.moveTo(17,0); ctx.lineTo(9,-6); ctx.lineTo(9,6); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(px,py,9,0,7); ctx.fill();
  ctx.fillStyle="#F0663F"; ctx.beginPath(); ctx.arc(px,py,5,0,7); ctx.fill();
  // north arrow + scale bar
  ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  const nx=cw-26, ny=34; ctx.fillStyle="rgba(15,24,17,.72)"; ctx.beginPath(); ctx.arc(nx,ny,18,0,7); ctx.fill();
  ctx.fillStyle="#F3F6EF"; ctx.beginPath(); ctx.moveTo(nx,ny-12); ctx.lineTo(nx-6,ny+4); ctx.lineTo(nx+6,ny+4); ctx.closePath(); ctx.fill();
  ctx.font="600 9px 'JetBrains Mono', monospace"; ctx.fillText("N",nx,ny+14);
  ctx.strokeStyle="#F3F6EF"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cw-122,62); ctx.lineTo(cw-122,68); ctx.lineTo(cw-22,68); ctx.lineTo(cw-22,62); ctx.stroke(); ctx.lineWidth=1;
  ctx.fillText("100 m", cw-72, 82);
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function compass(dx,dy){ const a=(Math.atan2(dx,-dy)*180/Math.PI+360)%360; return ["N","NE","E","SE","S","SW","W","NW"][Math.round(a/45)%8]; }
function gridRef(x,y){ return `E${String(Math.round(x)).padStart(4,"0")} N${String(Math.round(H-y)).padStart(4,"0")}`; }
const badge=(sp,size)=>portraitHTML(sp, size==="s"?"s":"m");

function nearest(){ let best=null,bd=1e9; for(const g of groups){ const d=Math.hypot(g.x-player.x,g.y-player.y); if(d<bd){bd=d;best=g;} } return [best,bd]; }

function fieldHTML(){
  if(obs) return obsHTML();
  const dd=o=>Math.hypot(o.x-player.x,o.y-player.y);
  const inRange = groups.filter(g=>levelOf(g)===3).sort((a,b)=>dd(a)-dd(b))[0];
  const danger = hazards.filter(h=>hazLevel(h)).sort((a,b)=>(dd(a)-HAZ[a.haz].danger)-(dd(b)-HAZ[b.haz].danger))[0];
  const warnHTML = danger ? `<div class="warn" role="alert">${portraitHTML(danger.haz,"s")}<div><b>${esc(HAZ[danger.haz].warn)}</b><br><span class="small">${Math.round(dd(danger)/5)*5} m to the ${compass(danger.x-player.x,danger.y-player.y)} · keep outside the red circle</span></div></div>` : "";
  if(inRange){ const S=SPECIES[inRange.sp];
    return `<div class="stack">${warnHTML}
      <div><div class="eyebrow">In observation range</div><h2>${esc(S.name)} spotted</h2>
      <p class="muted">You're close enough to watch without disturbing them. Tap the animal on the map or the button below to start a focal sample, then code what it's doing.</p></div>
      ${portraitHTML(inRange.sp,"xl")}
      <div class="plate" style="grid-template-columns:1fr"><div><h3>${esc(S.name)}</h3><div class="sci">${esc(S.sci)}</div>
        <dl class="kv" style="margin:8px 0 0"><dt>Focal</dt><dd>${inRange.indiv}</dd></dl></div></div>
      <button class="btn" id="startObs" data-id="${inRange.id}">Begin focal sample</button></div>`; }
  const [g,d]=nearest(); const dir=compass(g.x-player.x,g.y-player.y); const m=Math.round(d/5)*5;
  const L=levelOf(g);
  let lead, sub;
  if(L===2){ lead=`${SPECIES[g.sp].name}s ${m} m to the ${dir}`; sub="Identified from a distance. Walk closer to start observing."; }
  else if(L===1){ lead=`Rustling ${m} m to the ${dir}`; sub="Something is moving in the vegetation. Approach, or scan with binoculars to identify it."; }
  else { lead=`Faint calls to the ${dir}`; sub=`Roughly ${Math.round(d/50)*50} m away. Follow the trails or head ${dir} to pick up the signs.`; }
  const done=log.length;
  return `<div class="stack">${warnHTML}
    <div style="display:flex;gap:14px;align-items:flex-start">${L===2?portraitHTML(g.sp,"m"):""}<div><div class="eyebrow">Walking transect · ${esc(ZONE_NAME[zoneAt(player.x,player.y)])}</div><h2>${lead}</h2><p class="muted" style="margin:0">${sub}</p></div></div>
    <div class="note small"><b>How it works.</b> Signs appear inside your dashed detection ring. Get within about 40 m, but don't walk right into them or they'll move off. Then run a focal sample: watch the individual, then code its behaviour against the ethogram. Correct codes fill in your ethogram; wrong ones are corrected and still logged. <b>Stay away from elephants and snakes</b>: if you walk inside their red circles, you'll be sent back to camp for 2 minutes.</div>
    <div><div class="eyebrow" style="margin-bottom:8px">Study species</div><div class="prog">${SP_KEYS.map(k=>`<div class="progrow">${badge(k,"s")}<div><b>${SPECIES[k].name}</b></div></div>`).join("")}</div></div>
    <p class="muted small">${done ? `${done} observation${done>1?"s":""} in the notebook.` : "No observations logged yet."} Species from different continents share this training reserve so you can practise all four in one walk.</p>
    <p class="copy">© 2026 Kayla Kolff. All rights reserved.</p>
  </div>`;
}

function fmtT(ms){ const s=Math.floor(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }

function stats(){
  let score=0, streak=0, best=0, ok=0;
  for(const e of log){ if(e.ok){ ok++; streak++; best=Math.max(best,streak); score+=10+(streak>=3?5:0); } else { streak=0; score+=2; } }
  score=Math.max(0, score - 15*incidents.length);
  return {score, ok, n:log.length, acc: log.length?Math.round(ok/log.length*100):0, streak, best, inc:incidents.length};
}

function guideHTML(){
  return `<div class="stack"><div><div class="eyebrow">Reference</div><h2>Ethogram</h2>
    <p class="muted">An ethogram lists a species' behaviours with short operational definitions, so every observer codes the same thing the same way.</p></div>
    <div>${SP_KEYS.map(k=>{ const S=SPECIES[k]; return `<details><summary>${badge(k,"s")}<span><b>${S.name}</b> <span class="sci">${S.sci}</span></span><span class="code muted">${learned[k].size}/${S.behs.length}</span></summary>
      ${S.behs.map(b=>`<div class="beh"><span class="code">${b.code}</span><span><b>${esc(b.name)}</b>${esc(b.def)}</span></div>`).join("")}</details>`; }).join("")}</div>
    <div><h3 class="guide-h">Field safety</h3><p class="muted small" style="margin:0 0 4px">Some animals in the reserve are dangerous. Recognise them early and keep your distance.</p>
    ${SAFETY.map(x=>`<details><summary>${portraitHTML(x.k,"s")}<span><b>${esc(x.name)}</b> <span class="sci">${esc(x.sci)}</span></span><span class="code muted">avoid</span></summary>
      <div class="beh"><span class="code">SIGN</span><span><b>How to recognise it</b>${esc(x.sign)}</span></div>
      <div class="beh"><span class="code">DO</span><span><b>What to do</b>${esc(x.todo)}</span></div></details>`).join("")}</div><p class="copy">© 2026 Kayla Kolff. All rights reserved.</p></div>`;
}
const SAFETY=[
  {k:"EL", name:"Forest elephant", sci:"Loxodonta cyclotis", sign:"Large grey shape, crashing vegetation, low rumbles. Can be seen from far away. Ears spread wide and head raised mean it's getting stressed.", todo:"Keep at least 50 m away, stay downwind, and never block its path or come between a mother and calf."},
  {k:"VP", name:"Rhinoceros viper", sci:"Bitis nasicornis", sign:"Heavy-bodied snake with horn-like scales on its nose and a bold pattern of blue, green, black and red. It lies still on the forest floor, often near water, and is hard to spot until you're close.", todo:"Watch where you step, stay on trails and wear boots. If you see one, walk around it at a good distance."},
  {k:"JA", name:"Jararaca", sci:"Bothrops jararaca", sign:"Brown pit viper with dark triangular markings, hard to spot on the forest floor of Brazilian forest.", todo:"Look before you step or put your hand down. Give it space and let it move away."},
];

let lastField="";
function renderPane(){
  Object.entries(tabs).forEach(([k,id])=>document.getElementById(id).setAttribute("aria-selected",String(k===tab)));
  document.getElementById("logCount").textContent = log.length?`(${log.length})`:"";
  document.getElementById("ethoCount").textContent = `${Object.values(learned).reduce((a,s)=>a+s.size,0)} / ${TOTAL_BEHS}`;
  document.getElementById("scoreVal").textContent = stats().score;
  const html = tab==="field"?fieldHTML():tab==="notes"?notesHTML():guideHTML();
  if(html!==lastField){ pane.innerHTML=html; lastField=html; }
}

pane.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.id==="startObs"){ const g=groups.find(x=>x.id===+t.dataset.id); if(g) startObs(g); }
  else if(t.classList.contains("opt") && obs && obs.stage==="choose"){ obs.choice=+t.dataset.i; obs.stage="result"; renderPane(); }
  else if(t.id==="logBtn") finishObs();
  else if(t.id==="stopObs"){ obs=null; lastField=""; renderPane(); toast("Sample stopped. Nothing was logged."); }
  else if(t.id==="clearLog"){ document.getElementById("clearConfirm").hidden=false; t.hidden=true; }
  else if(t.id==="clearNo"){ lastField=""; renderPane(); }
  else if(t.id==="clearYes"){ log=[]; SP_KEYS.forEach(k=>learned[k]=new Set()); save(); lastField=""; renderPane(); }
});

function startObs(g){
  player.dest=null; const S=SPECIES[g.sp];
  const others=S.behs.map((_,i)=>i).filter(i=>i!==g.bi).sort(()=>rnd()-.5).slice(0,3);
  obs={g, stage:"cues", shown:1, options:[g.bi,...others].sort(()=>rnd()-.5), choice:null};
  tab="field"; renderPane();
  const total=S.behs[g.bi].cue.length, per=2400; const t0=performance.now(); obs.total=per*total;
  const tick=()=>{ if(!obs||obs.g!==g||obs.stage!=="cues") return;
    const el=(performance.now()-t0); const bar=document.getElementById("obsBar"); if(bar) bar.style.width=Math.min(100,el/(per*total)*100)+"%";
    const tm=document.getElementById("obsTimer"); if(tm) tm.textContent=`${fmtT(Math.min(el,per*total))} / ${fmtT(per*total)}`;
    const want=Math.min(total,1+Math.floor(el/per));
    if(want!==obs.shown){ obs.shown=want; renderPane(); }
    if(el>=per*total){ obs.stage="choose"; renderPane(); return; }
    requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
function finishObs(){
  const before=new Set(badgeList().filter(b=>b.got).map(b=>b.id));
  const g=obs.g, S=SPECIES[g.sp], b=S.behs[g.bi], ok=obs.choice===g.bi;
  const d=new Date();
  log.push({time:`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`, sp:g.sp, indiv:g.indiv, code:b.code, name:b.name, ok, grid:gridRef(g.x,g.y), zone:ZONE_NAME[zoneAt(g.x,g.y)]});
  if(ok) learned[g.sp].add(b.code);
  save();
  groups=groups.filter(x=>x!==g); groups.push(makeGroup(g.sp));
  obs=null; lastField=""; renderPane();
  const fresh=badgeList().filter(b=>b.got && !before.has(b.id));
  if(fresh.length) toast(`Badge earned: ${fresh.map(b=>b.name).join(", ")}!`,5000);
  else { const st=stats(); toast(ok?`+${10+(st.streak>=3?5:0)} points${st.streak>=3?` · streak ${st.streak}`:""}`:"+2 points for logging it. Check the ethogram and try again next time.",2600); }
}

setInterval(()=>{ document.getElementById("gridref").textContent=gridRef(player.x,player.y);
  document.getElementById("zoneLabel").textContent=ZONE_NAME[zoneAt(player.x,player.y)];
  updateScanBtn(); tickCamp(); if(tab==="field" && !obs) renderPane(); },300);

/* ---------- Tutorial ---------- */
const TUT=[
  {t:"Welcome to PrimaGo", b:"You're a field researcher on a training reserve with four primate species. Your job: find them, watch what they do, and record their behaviour like a real primatologist. This takes about a minute.", at:null},
  {t:"This is you", b:"The orange dot in the middle of the map is you, and the arrow shows which way you're facing. Tap anywhere on the map to walk there, or use the arrow keys.", at:()=>mapSpot(26)},
  {t:"Listen for signs", b:"The dashed ring is how far you can hear. When an animal is inside it, a pulsing ? appears where something is rustling. The Field panel also tells you which direction to head.", at:()=>mapSpot(122)},
  {t:"Use your binoculars", b:"Scanning identifies animals much further away, so you know what's there before you walk over.", at:()=>el("scanBtn")},
  {t:"Approach carefully", b:"Once you're within about 40 m, an orange ring appears around the animal. Don't walk right into it, or it will move off. Tapping an animal walks you to a safe distance automatically.", at:()=>mapSpot(80)},
  {t:"Watch out for danger", b:"Elephants and venomous snakes live here too. They're marked with a red circle: never walk inside it, or you'll be sent back to camp, lose 15 points and have to wait 2 minutes before going out again. Snakes only show up when you're close, so keep an eye on the Field panel.", at:null},
  {t:"Run a focal sample", b:"Tap the animal, or press Begin focal sample in this panel. Watch closely: what it does appears here, line by line, while the timer runs.", at:()=>el("pane")},
  {t:"Code the behaviour", b:"When the sample ends, pick the ethogram code that matches what you saw. Unsure? The Ethogram tab lists every behaviour with its definition.", at:()=>el("tab-guide")},
  {t:"Track your progress", b:"The Notebook keeps every observation, your score, accuracy and badges.", at:()=>el("tab-notes")},
];
let tutI=-1, tutEls=null;
function el(id){ return document.getElementById(id); }
function mapSpot(r){ const b=el("mapwrap").getBoundingClientRect(); clampCam(); const [sx,sy]=toScreen(player.x,player.y); const cx=b.left+sx, cy=b.top+sy; return {rect:{left:cx-r,top:cy-r,width:r*2,height:r*2}, round:true}; }
function tutOpen(){
  if(tutEls) return; tutShown=true;
  const block=document.createElement("div"); block.className="tut-block";
  const hole=document.createElement("div"); hole.className="tut-hole";
  const card=document.createElement("div"); card.className="tut-card"; card.setAttribute("role","dialog"); card.setAttribute("aria-modal","true"); card.setAttribute("aria-labelledby","tutTitle");
  document.body.append(block,hole,card); tutEls={block,hole,card};
  card.addEventListener("click",e=>{ const t=e.target.closest("button"); if(!t) return;
    if(t.id==="tutNext") tutGo(tutI+1); else if(t.id==="tutBack") tutGo(tutI-1); else if(t.id==="tutSkip") tutClose(); });
  addEventListener("keydown",tutKey); addEventListener("resize",tutPlace);
  player.dest=null; tutGo(0);
}
function tutKey(e){ if(!tutEls) return; if(e.key==="Escape") tutClose(); else if(e.key==="ArrowRight"){ e.preventDefault(); e.stopPropagation(); tutGo(tutI+1);} else if(e.key==="ArrowLeft"){ e.preventDefault(); e.stopPropagation(); tutGo(tutI-1);} }
function tutClose(){ if(!tutEls) return; Object.values(tutEls).forEach(n=>n.remove()); tutEls=null; tutI=-1;
  removeEventListener("keydown",tutKey); removeEventListener("resize",tutPlace);
  keys={}; el("helpBtn").focus(); }
function tutGo(i){
  if(i<0) return; if(i>=TUT.length){ tutClose(); return; }
  tutI=i; const st=TUT[i], last=i===TUT.length-1;
  tutEls.card.innerHTML=`<div class="eyebrow">Step ${i+1} of ${TUT.length}</div><h3 id="tutTitle">${esc(st.t)}</h3><p>${esc(st.b)}</p>
    <div class="tut-foot"><div class="tut-dots" aria-hidden="true">${TUT.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div><span class="sp"></span>
    ${i>0?`<button class="btn ghost" id="tutBack">Back</button>`:`<button class="tut-skip" id="tutSkip">Skip tutorial</button>`}
    <button class="btn" id="tutNext">${last?"Start exploring":i===0?"Show me":"Next"}</button></div>`;
  tutPlace(); el("tutNext").focus();
}
function tutPlace(){
  if(!tutEls||tutI<0) return; const st=TUT[tutI], {hole,card}=tutEls, vw=innerWidth, vh=innerHeight, pad=8, M=16;
  let r=null, round=false;
  if(st.at){ const t=st.at(); if(t && t.rect){ r=t.rect; round=t.round; } else if(t){ const b=t.getBoundingClientRect(); r={left:b.left-pad,top:b.top-pad,width:b.width+pad*2,height:b.height+pad*2}; } }
  if(r){ hole.style.display="block"; Object.assign(hole.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px",borderRadius:round?"50%":"10px"}); }
  else { hole.style.display="block"; Object.assign(hole.style,{left:vw/2+"px",top:vh/2+"px",width:"0px",height:"0px",borderRadius:"50%"}); }
  const cw=card.offsetWidth, chh=card.offsetHeight; let x,y;
  if(!r){ x=(vw-cw)/2; y=(vh-chh)/2; }
  else {
    const below=r.top+r.height+12, above=r.top-12-chh, right=r.left+r.width+12, left=r.left-12-cw;
    if(below+chh<=vh-M){ y=below; x=r.left+r.width/2-cw/2; }
    else if(above>=M){ y=above; x=r.left+r.width/2-cw/2; }
    else if(right+cw<=vw-M){ x=right; y=r.top+r.height/2-chh/2; }
    else if(left>=M){ x=left; y=r.top+r.height/2-chh/2; }
    else { x=(vw-cw)/2; y=vh-chh-M; }
  }
  card.style.left=Math.max(M,Math.min(vw-cw-M,x))+"px"; card.style.top=Math.max(M,Math.min(vh-chh-M,y))+"px";
}
el("helpBtn").addEventListener("click",tutOpen);
let tutShown=false; // the tutorial opens every time the page is opened

/* ---------- Sound: a forest recording that loops quietly, plus recorded effects ---------- */
let soundOn=true; try{ soundOn=localStorage.getItem("transect-sound")!=="off"; }catch(e){}
let AC=null, bgGain=null, bgBuf=null, bgNext=0, bgLoading=false;
const BG_VOL=0.35, BG_FADE=2.5, BG_PAD=0.06;
function fadeCurve(up){ const n=64, a=new Float32Array(n); for(let i=0;i<n;i++){ const x=i/(n-1)*Math.PI/2; a[i]=up?Math.sin(x):Math.cos(x); } return a; }
// each pass of the recording fades in over the end of the one before, so the loop has no gap or click
function bgSchedule(){ if(!bgBuf||!AC||AC.state!=="running") return; const L=bgBuf.duration-2*BG_PAD;
  while(bgNext<AC.currentTime+6){ const t=Math.max(bgNext,AC.currentTime+0.05), src=AC.createBufferSource(), g=AC.createGain(); src.buffer=bgBuf; g.gain.value=0;
    g.gain.setValueCurveAtTime(fadeCurve(true),t,BG_FADE); g.gain.setValueCurveAtTime(fadeCurve(false),t+L-BG_FADE,BG_FADE);
    src.connect(g); g.connect(bgGain); src.start(t,BG_PAD,L); bgNext=t+L-BG_FADE; } }
function soundStart(){ if(!soundOn||document.hidden) return;
  try{ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C||!window.PG_BG) return; AC=new C(); bgGain=AC.createGain(); bgGain.gain.value=BG_VOL; bgGain.connect(AC.destination); }
    if(AC.state==="suspended") AC.resume();
    if(!bgBuf && !bgLoading){ bgLoading=true;
      decodeB64(window.PG_BG, b=>{ bgBuf=b; bgNext=AC.currentTime+0.1; bgSchedule(); setInterval(bgSchedule,1000); }, ()=>{ bgLoading=false; });
      Object.entries(window.PG_FX||{}).forEach(([k,v])=>decodeB64(v, b=>{ FX[k]=b; }, ()=>{})); }
  }catch(e){} }
function decodeB64(b64,ok,fail){ const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); AC.decodeAudioData(u.buffer,ok,fail); }
/* ---------- Recorded sounds: elephant, snake and footsteps on leaves ---------- */
const FX={}, FX_VOL=0.6, FX_FAR=0.4, STEP_VOL=0.4, fxLast={};
const soundReady=()=>soundOn && AC && AC.state==="running";
// the same sound never plays twice within 1.8 s, so two animals found together do not overlap
function playFx(name,vol){ if(!soundReady()||!FX[name]) return; const now=performance.now(); if(now-(fxLast[name]||-1e9)<1800) return; fxLast[name]=now; const src=AC.createBufferSource(), g=AC.createGain(); src.buffer=FX[name]; g.gain.value=vol||FX_VOL; src.connect(g); g.connect(AC.destination); src.start(); }
// footsteps loop while you walk on land and fade out when you stop or wade through the river
const STEP_STARTS=[0,0.38,0.78,1.21,1.57,1.97,2.4,2.8,3.23,3.61,4.0,4.4,4.78,5.17,5.58,6.01,6.38,6.79,7.17,7.62,7.98,8.39,8.82,9.2];
let stepSrc=null, stepGain=null;
function updateSteps(walk){
  if(walk && !stepSrc){ if(!soundReady()||!FX.steps) return; const t=AC.currentTime;
    stepGain=AC.createGain(); stepGain.gain.setValueAtTime(0,t); stepGain.gain.linearRampToValueAtTime(STEP_VOL,t+0.05); stepGain.connect(AC.destination);
    stepSrc=AC.createBufferSource(); stepSrc.buffer=FX.steps; stepSrc.loop=true; stepSrc.connect(stepGain); stepSrc.start(t,STEP_STARTS[Math.floor(Math.random()*STEP_STARTS.length)]); }
  else if(!walk && stepSrc){ const t=AC.currentTime, g=stepGain, src=stepSrc; stepSrc=null; stepGain=null;
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(0,t+0.25); try{ src.stop(t+0.3); }catch(e){} } }
function soundBtnText(){ const b=el("soundBtn"); b.textContent=soundOn?"Sound: on":"Sound: off"; b.setAttribute("aria-pressed",String(soundOn)); }
function setSound(on){ soundOn=on; try{ localStorage.setItem("transect-sound",on?"on":"off"); }catch(e){} soundBtnText();
  if(on){ soundStart(); if(bgGain){ bgGain.gain.cancelScheduledValues(AC.currentTime); bgGain.gain.setTargetAtTime(BG_VOL,AC.currentTime,0.15); } }
  else if(AC){ bgGain.gain.cancelScheduledValues(AC.currentTime); bgGain.gain.setTargetAtTime(0,AC.currentTime,0.08); setTimeout(()=>{ if(!soundOn&&AC) AC.suspend(); },450); } }
el("soundBtn").addEventListener("click",e=>{ e.stopPropagation(); setSound(!soundOn); });
// browsers only allow sound after a tap or key press, so it starts with the first one
addEventListener("pointerdown",soundStart,true); addEventListener("keydown",soundStart,true);
document.addEventListener("visibilitychange",()=>{ if(!AC) return; if(document.hidden) AC.suspend(); else if(soundOn) AC.resume(); });
soundBtnText();

renderPane();
requestAnimationFrame(step);
if(camp){ player.x=CAMP.x; player.y=CAMP.y; cam.x=CAMP.x; cam.y=CAMP.y; showCamp(); }
else setTimeout(tutOpen,400);
})();
</script>
