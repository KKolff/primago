<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>

:root{
  --ground:#EEF1EA; --surface:#F8FAF5; --ink:#1C2620; --muted:#5B6A5F; --line:#CCD5C8;
  --chip:#E1E8DC; --tape:#E0512A; --tape-ink:#FFFFFF; --good:#2F7D4F; --bad:#B23A2A;
  --display:"Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121813; --surface:#1A221C; --ink:#E3EAE1; --muted:#96A596; --line:#2D3A30;
    --chip:#223026; --tape:#F0663F; --good:#5DBB82; --bad:#E07262;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121813; --surface:#1A221C; --ink:#E3EAE1; --muted:#96A596; --line:#2D3A30;
  --chip:#223026; --tape:#F0663F; --good:#5DBB82; --bad:#E07262;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;box-sizing:border-box}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-inline:16px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand .tape{display:inline-block;width:18px;height:8px;background:var(--tape);transform:translateY(-3px) skewX(-18deg)}
.meta{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:600}
.main{display:grid;grid-template-columns:1fr 390px;min-height:0}
.mapwrap{position:relative;min-height:0;overflow:hidden;background:#20331f}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.overlay{position:absolute;display:flex;gap:8px;align-items:center}
.ov-bl{left:12px;bottom:12px;font-size:12px;color:#EEF3E8;background:rgba(15,24,17,.72);padding:6px 10px;border-radius:4px;max-width:calc(100% - 300px)}
.ov-br{right:12px;bottom:12px}
.ov-tl{left:12px;top:12px;font-family:var(--mono);font-size:11px;color:#EEF3E8;background:rgba(15,24,17,.72);padding:5px 8px;border-radius:4px}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:4px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--tape);color:var(--tape-ink);letter-spacing:.01em}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.map{background:rgba(15,24,17,.82);color:#F3F6EF;border:1px solid rgba(255,255,255,.25)}
.btn:focus-visible,.tab:focus-visible,.opt:focus-visible,summary:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
aside{border-left:1px solid var(--line);background:var(--surface);display:grid;grid-template-rows:auto 1fr;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;padding:12px 8px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;font-size:14px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tape)}
.pane{overflow-y:auto;padding-block:16px;padding-inline:18px}
.eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;margin:4px 0 6px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.plate{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--ground)}
.badge{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:16px;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px var(--line)}
.portrait{border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.portrait svg{display:block;width:100%;height:100%}
.portrait.s{width:28px;height:28px}
.portrait.m{width:64px;height:64px}
.portrait.xl{width:100%;max-width:220px;aspect-ratio:1;height:auto;margin-inline:auto;border-radius:10px;box-shadow:0 0 0 1px var(--line);animation:reveal .5s ease both}
@keyframes reveal{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}
.sci{font-style:italic;color:var(--muted);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-size:12px}
.cues{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--tape);padding-left:12px}
.cue{animation:in .45s ease both}
@keyframes in{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bar{height:4px;background:var(--chip);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tape);width:0}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}
.opt:hover{border-color:var(--tape)}
.opt code,.code{font-family:var(--mono);font-weight:600;font-size:13px}
.opt.right{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.verdict{font-weight:700}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.note{background:var(--chip);padding:10px 12px;border-radius:5px;font-size:14px}
.entries{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:46px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.entry .t{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.entry .what{font-size:14px}
.entry .sub{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.fix{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.prog{display:grid;gap:8px}
.progrow{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:3px;background:var(--chip);color:var(--muted)}
.chip.on{background:var(--ink);color:var(--surface)}
details{border-bottom:1px solid var(--line);padding-block:10px}
summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
.beh{display:grid;grid-template-columns:48px 1fr;gap:10px;padding-top:10px;font-size:14px}
.beh b{display:block}
.empty{padding:18px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);text-align:center}
.small{font-size:13px}
.warn{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:6px;background:color-mix(in srgb,var(--bad) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);color:var(--ink);font-size:14px}
.warn b{color:var(--bad)}
.danger-flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 6px #E24030,inset 0 0 90px rgba(226,64,48,.55);animation:dflash .9s ease-out forwards;z-index:2}
@keyframes dflash{from{opacity:1}to{opacity:0}}
.guide-h{margin:18px 0 4px}
.scene{width:100%;aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.scene svg{display:block;width:100%;height:100%}
.timer{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.toast{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:rgba(15,24,17,.92);color:#F3F6EF;padding:9px 14px;border-radius:6px;font-size:13px;max-width:min(420px,86%);text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:3}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.stat{background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--muted)}
.stat b{display:block;font-family:var(--display);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bdg{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:12px;line-height:1.3;background:var(--surface)}
.bdg.locked{opacity:.5;filter:grayscale(1)}
.bdg .ico{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-family:var(--mono);font-weight:700;font-size:11px;color:var(--ink)}
.bdg b{display:block;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;vertical-align:middle}
.seg button{border:0;background:transparent;padding:3px 9px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--tape);outline-offset:-2px}
.helpbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;padding:3px 10px;font-size:12px;font-weight:600}
.helpbtn:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.tut-block{position:fixed;inset:0;z-index:50}
.tut-hole{position:fixed;z-index:51;border-radius:12px;box-shadow:0 0 0 9999px rgba(10,16,12,.64);outline:2px solid var(--tape);outline-offset:2px;pointer-events:none;transition:top .25s,left .25s,width .25s,height .25s,border-radius .25s}
.tut-card{position:fixed;z-index:52;width:min(340px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border-radius:10px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.35);transition:top .25s,left .25s}
.tut-card h3{font-size:20px;margin:2px 0 6px;text-wrap:balance}
.tut-card p{font-size:14px;margin:0 0 12px}
.tut-foot{display:flex;align-items:center;gap:8px}
.tut-foot .sp{flex:1}
.tut-dots{display:flex;gap:4px}
.tut-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tut-dots i.on{background:var(--tape)}
.tut-skip{background:none;border:0;color:var(--muted);font-size:13px;padding:6px 4px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.tut-hole,.tut-card{transition:none}}
@media (max-width:820px){
  .main{grid-template-columns:1fr;grid-template-rows:52% 48%}
  aside{border-left:0;border-top:1px solid var(--line)}
  .brand{font-size:19px}
  .meta{gap:10px}
  .ov-bl{max-width:calc(100% - 180px);font-size:11px}
}
@media (prefers-reduced-motion:reduce){.cue,.portrait.xl,.danger-flash{animation:none}}

.warn{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:6px;background:color-mix(in srgb,var(--bad) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);color:var(--ink);font-size:14px}
.warn b{color:var(--bad)}

.video{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;background:#111;box-shadow:0 0 0 1px var(--line)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gpsbig{display:flex;gap:12px;align-items:center;font-size:15px}
.gpsbig .arrow{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--tape);color:var(--tape-ink);font-size:24px;font-weight:700;flex:none}
.codeform{display:flex;gap:8px;flex-wrap:wrap}
.codeform input,.fld input,.fld select,.teacher-view textarea{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);min-width:0}
.codeform input{flex:1 1 140px;text-transform:uppercase;font-family:var(--mono)}
.codeform input::placeholder{text-transform:none;font-family:var(--body)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a.btn{text-decoration:none;display:inline-block}
.pill:not(.ok):not(.fix){background:var(--chip);color:var(--muted)}
.teacher-view{position:fixed;inset:0;z-index:40;background:var(--ground);overflow-y:auto;padding-block:20px;padding-inline:16px}
.tv-inner{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tv-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.tv-steps{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--muted)}
.tv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select{font-weight:400}
.tv-stop{border:1px solid var(--line);border-radius:8px;padding:12px 14px 14px;background:var(--surface);margin:0}
.tv-stop legend{font-size:13px;padding:0 6px;color:var(--muted)}
.tv-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tv-row .sp{flex:1}
.tv-actions{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.tv-actions h3{margin:0}
.teacher-view textarea{width:100%;box-sizing:border-box;font-family:var(--mono);font-size:12px}
.ok-t{color:var(--good);font-weight:600}
.tv-actions summary{display:list-item;cursor:pointer}
.tv-inner > .btn{align-self:flex-start}
.qr-sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.qr-card{background:#fff;color:#111;border:1px solid #ccc;border-radius:8px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;break-inside:avoid}
.qr-card svg{width:100%;max-width:170px;height:auto}
.qr-t{font-weight:700;font-size:14px}.qr-c{font-family:var(--mono);font-size:14px}.qr-h{font-size:12px;color:#555}

.codeform input::placeholder{text-transform:none;font-family:var(--body)}
[hidden]{display:none!important}
.teacher-view{position:fixed;inset:0;z-index:40;background:var(--ground);overflow-y:auto;padding-block:20px;padding-inline:16px}

.tv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select{font-weight:400}
.tv-stop{border:1px solid var(--line);border-radius:8px;padding:12px 14px 14px;background:var(--surface);margin:0}
.tv-stop legend{font-size:13px;padding:0 6px;color:var(--muted)}

.tv-inner > .btn{align-self:flex-start}


html,body{height:auto;min-height:100%}
.page{max-width:720px;margin:0 auto;padding-block:0 40px;padding-inline:16px}
.tp-head{display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.tp-head .brand{font-size:22px}
.tp-head .sub{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.page .tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--ground);z-index:5;margin-inline:-16px;padding-inline:16px}
#pane{padding-block:18px}
.teacher-view{position:static;inset:auto;overflow:visible;padding-block:18px;padding-inline:0;background:transparent}
.toast{position:fixed;top:auto;bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.rowbtn{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer}
.rowbtn:hover .what{color:var(--tape)}
.rowbtn:focus-visible,.spbtn:focus-visible,.opt:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.spgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.spbtn{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:600;text-align:left;cursor:pointer}
.spbtn.on{border-color:var(--tape);box-shadow:inset 0 0 0 1px var(--tape)}
.spbtn.wide{grid-column:1/-1}
.fld textarea{font:inherit;font-size:15px;font-weight:400;padding:9px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);min-width:0}
.fld textarea{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);font-weight:400}
.tv-pt{display:grid;grid-template-columns:auto minmax(170px,1fr) auto;gap:10px;align-items:center}
.gpsco{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;margin-top:4px}
.gpsco span{user-select:all}
.howto{margin:8px 0 0;padding-left:20px;display:grid;gap:3px;color:var(--muted)}
.tv-pt input.coord{font-family:var(--mono);font-size:13px}
.tv-pt input.coord.bad{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.tv-key{grid-column:1/-1;display:grid;grid-template-columns:1fr minmax(150px,210px);gap:10px;padding-bottom:4px}
.tv-key .fld{min-width:0}
.tv-pt select{font:inherit;font-size:14px;font-weight:400;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);min-width:0}
.tv-pt input{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);min-width:0}
.tv-mini{display:flex;gap:4px}.tv-mini .btn{padding:6px 10px}
.tv-pt .tv-key input{font-weight:400}
@media (max-width:560px){ .tv-pt{grid-template-columns:1fr auto} .tv-pt > input{grid-column:1/-1} .tv-pt .tv-mini{grid-column:1/-1} .tv-key{grid-template-columns:1fr} }
.btn.small{padding:6px 10px;font-size:13px}

</style>
</head>
<body style="margin:0">

<div class="page">
  <header class="tp-head"><div class="brand">Field trail</div></header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-trail" aria-selected="true">Trail</button>
    <button class="tab" role="tab" id="tab-results" aria-selected="false">My results <span id="resCount"></span></button>
    <button class="tab" role="tab" id="tab-teacher" aria-selected="false" hidden>Teacher setup</button>
  </div>
  <main id="pane" aria-live="polite"></main>
  <section id="teacherView" class="teacher-view" hidden aria-label="Teacher setup"></section>

    <div class="tv-stop"><h3 style="margin:0 0 4px">GPS points</h3>
      <p class="small muted" style="margin:0 0 8px">One point per line: latitude, then longitude. You can copy coordinates straight from Google Maps or a spreadsheet. To fix a point later, edit its coordinates in the list below.</p>
      <label class="sr" for="gpsList">GPS points</label>
      <textarea id="gpsList" rows="6" placeholder="52.37021, 4.89517&#10;52.37110, 4.89700&#10;52.37185, 4.89612"></textarea>
      <div class="tv-row"><button class="btn" data-a="bulk">Add these points</button><button class="btn ghost" data-a="bulkReplace">Replace all points with this list</button><button class="btn ghost" data-a="here">Add my current location</button></div>
      <p id="bulkMsg" class="small" style="margin:6px 0 0" hidden></p></div>
    ${ok?`<div><div class="eyebrow" style="margin-bottom:4px">Your GPS points (${d.stops.length})</div><div class="entries">${d.stops.map((s,i)=>`<div class="entry tv-pt">
      <b>Spotting ${i+1}</b>
      <label class="sr" for="coord${i}">GPS for spotting ${i+1}</label><input id="coord${i}" class="coord" data-s="${i}" data-k="coord" inputmode="decimal" value="${(+s.lat).toFixed(6)}, ${(+s.lon).toFixed(6)}" title="Latitude, longitude">
      <span class="tv-mini"><button class="btn ghost" data-a="up" data-i="${i}" ${i===0?"disabled":""} aria-label="Move spotting ${i+1} up">↑</button><button class="btn ghost" data-a="down" data-i="${i}" ${i===d.stops.length-1?"disabled":""} aria-label="Move spotting ${i+1} down">↓</button><button class="btn ghost" data-a="del" data-i="${i}" aria-label="Remove spotting ${i+1}">✕</button></span>
      <div class="tv-key"><label class="fld" for="qr${i}">QR code at this point<input id="qr${i}" data-s="${i}" data-k="qr" maxlength="120" autocomplete="off" value="${esc(s.qr||"")}" placeholder="e.g. QR 3, chimpanzee grooming video"></label>
        <label class="fld" for="sp${i}">Correct species<select id="sp${i}" data-s="${i}" data-k="species"><option value="">Not set</option>${Object.entries(KEY_SPECIES).map(([k,n])=>`<option value="${k}" ${s.species===k?"selected":""}>${n}</option>`).join("")}</select></label></div></div>`).join("")}</div></div>`:""}
    <div class="tv-actions">
      <h3>Save and share your trail</h3>
      ${ok?"":`<p class="small muted" style="margin:0">Add at least one GPS point first.</p>`}
      <div class="tv-row"><button class="btn" data-a="dl" ${ok?"":"disabled"}>Download trail.json</button>
        <button class="btn ghost" data-a="preview" ${ok?"":"disabled"}>Try it on this device</button>
        ${(()=>{ try{ return localStorage.getItem("transect-trail-preview")==="on"; }catch(e){ return false; } })()?`<button class="btn ghost" data-a="unpreview">End preview</button>`:""}
        <label class="btn ghost" style="cursor:pointer">Open a trail.json<input type="file" id="trailFile" accept=".json,application/json" hidden></label></div>
      <details><summary class="small">Download not working? Copy the file text instead</summary>
        <p class="small muted">In your GitHub repository, choose <b>Add file → Create new file</b>, name it <code>trail.json</code> and paste this in.</p>
        <textarea id="trailText" readonly rows="6">${esc(trailFileText())}</textarea>
        <button class="btn ghost" data-a="copy">Copy text</button></details>
    </div></div>`;
}
function bulkAdd(replace){ const ta=document.getElementById("gpsList"), {out,bad}=parseGpsList(ta.value);
  const say=(t,good)=>{ const m=document.getElementById("bulkMsg"); m.hidden=false; m.style.color=good?"var(--good)":"var(--bad)"; m.textContent=t; };
  if(!out.length){ say(ta.value.trim()?"No coordinates found. Put latitude and longitude on each line, e.g. 52.37021, 4.89517":"Paste your points into the box first.",false); return; }
  if(replace) tDraft.stops=[]; tDraft.stops.push(...out); saveDraft(); renderTeacher();
  say(`Added ${out.length} point${out.length>1?"s":""}.`+(bad.length?` Skipped line${bad.length>1?"s":""} ${bad.join(", ")} (no coordinates found).`:""),true); }
function initTeacher(){
  tv.addEventListener("input",e=>{ const t=e.target;
    if(t.dataset.f==="name"){ tDraft.name=t.value; saveDraft(); }
    else if(t.dataset.k==="qr"){ tDraft.stops[+t.dataset.s].qr=t.value; saveDraft(); const ta=document.getElementById("trailText"); if(ta) ta.value=trailFileText(); }
    else if(t.dataset.k==="coord"){ const r=parseGpsList(t.value).out[0]; t.classList.toggle("bad",!r);
      if(r){ const st=tDraft.stops[+t.dataset.s]; st.lat=r.lat; st.lon=r.lon; saveDraft(); const ta=document.getElementById("trailText"); if(ta) ta.value=trailFileText(); } } });
  tv.addEventListener("focusout",e=>{ const t=e.target; if(t.dataset&&t.dataset.k==="coord"){ const st=tDraft.stops[+t.dataset.s]; if(!st) return;
    if(t.classList.contains("bad")) toast(`Spotting ${+t.dataset.s+1}: that isn't a valid latitude, longitude, so the previous point was kept.`,4500);
    t.value=`${(+st.lat).toFixed(6)}, ${(+st.lon).toFixed(6)}`; t.classList.remove("bad"); } });
  tv.addEventListener("change",e=>{ const t=e.target;
    if(t.dataset.k==="species"){ tDraft.stops[+t.dataset.s].species=t.value; saveDraft(); const ta=document.getElementById("trailText"); if(ta) ta.value=trailFileText(); }
    if(t.id==="trailFile" && t.files[0]) t.files[0].text().then(txt=>{ const j=cleanTrail(JSON.parse(txt)); if(!j) throw 0; tDraft=j; saveDraft(); renderTeacher(); toast("Trail loaded."); }).catch(()=>toast("That file isn't a valid trail.json.")); });
  tv.addEventListener("click",e=>{ const b=e.target.closest("button[data-a]"); if(!b) return; const a=b.dataset.a, i=+b.dataset.i, d=tDraft;
    if(a==="bulk") bulkAdd(false);
    else if(a==="bulkReplace"){ if(!d.stops.length||b.dataset.sure) bulkAdd(true); else { b.dataset.sure="1"; b.textContent=`Tap again to replace all ${d.stops.length} points`; } }
    else if(a==="del"){ if(b.dataset.sure){ d.stops.splice(i,1); saveDraft(); renderTeacher(); } else { b.dataset.sure="1"; b.textContent="Remove?"; b.setAttribute("aria-label",`Tap again to remove spotting ${i+1}`); } }
    else if(a==="up"&&i>0){ [d.stops[i-1],d.stops[i]]=[d.stops[i],d.stops[i-1]]; saveDraft(); renderTeacher(); }
    else if(a==="down"&&i<d.stops.length-1){ [d.stops[i+1],d.stops[i]]=[d.stops[i],d.stops[i+1]]; saveDraft(); renderTeacher(); }
    else if(a==="here"){ if(!("geolocation" in navigator)){ toast("This device can't share its location."); return; }
      b.textContent="Finding you…"; b.disabled=true;
      navigator.geolocation.getCurrentPosition(p=>{ d.stops.push({lat:+p.coords.latitude.toFixed(6), lon:+p.coords.longitude.toFixed(6)}); saveDraft(); renderTeacher(); toast(`Spotting ${d.stops.length} added (accurate to about ${Math.round(p.coords.accuracy)} m).`); },
        err=>{ renderTeacher(); toast(err&&err.code===1?"Location access is blocked. Allow it for this site, or paste the coordinates.":"Couldn't get your location. Try again outside, or paste the coordinates.",5000); },
        {enableHighAccuracy:true, timeout:20000, maximumAge:0}); }
    else if(a==="dl"){ const u=URL.createObjectURL(new Blob([trailFileText()],{type:"application/json"}));
      const l=document.createElement("a"); l.href=u; l.download="trail.json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); toast("trail.json downloaded. Upload it to GitHub next to trail.html."); }
    else if(a==="copy"){ const ta=document.getElementById("trailText"); navigator.clipboard.writeText(ta.value).then(()=>toast("Copied.")).catch(()=>{ ta.select(); toast("Select all and copy the text."); }); }
    else if(a==="preview"){ try{ localStorage.setItem("transect-trail-preview","on"); }catch(e){} view=null; tab="trail"; loadTrail(); toast("Preview on. The Trail tab now shows your points on this device."); }
    else if(a==="unpreview"){ try{ localStorage.removeItem("transect-trail-preview"); }catch(e){} loadTrail().then(()=>{ tab="teacher"; lastField=""; renderPane(); }); toast("Preview off."); }
  });
}
function openTeacher(){ loadDraft(); tab="teacher"; lastField=""; renderPane(); }


initTeacher();
// students only see Trail and My results; the Teacher setup tab appears when the link ends in #teacher
const isTeacherLink=()=>location.hash.toLowerCase()==="#teacher";
function showTeacherTab(){ const on=isTeacherLink(); document.getElementById("tab-teacher").hidden=!on; return on; }
addEventListener("hashchange",()=>{ if(showTeacherTab()) openTeacher(); else if(tab==="teacher"){ tab="trail"; view=null; lastField=""; renderPane(); } });
if(showTeacherTab()) openTeacher(); else renderPane();
loadTrail().then(()=>{ if(tab==="teacher"){ loadDraft(); lastField=""; renderPane(); } });

})();
</script>
